<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNS Propagation Checker — oxyd.space</title>
<meta name="description" content="Check DNS propagation across 32 global servers. Free, no auth, instant results.">
<link rel="canonical" href="https://oxyd.space/propagation.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23818cf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='url(%23g)' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#05080c;--panel:#0b1118;--panel-2:#0e1520;--line:#182231;
  --text:#dbe7f3;--muted:#8296ad;--accent:#22d3ee;--accent-2:#818cf8;
  --ok:#34d399;--bad:#f87171;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:
    radial-gradient(1000px 500px at 80% -10%,rgba(129,140,248,.12),transparent 60%),
    radial-gradient(800px 420px at 10% -5%,rgba(34,211,238,.10),transparent 55%),
    var(--bg);
  color:var(--text);font-family:"Inter",system-ui,-apple-system,sans-serif;line-height:1.6;min-height:100vh;
}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.container{max-width:960px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(5,8,12,.72);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--text);display:flex;align-items:center;gap:8px}
.logo:hover{text-decoration:none}
.nav-links{display:flex;gap:20px;font-size:14px}
.nav-links a{color:var(--muted)}.nav-links a:hover{color:var(--text)}

.tool{margin:40px auto;max-width:860px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.sub{color:var(--muted);font-size:14.5px;margin-bottom:28px}

.map-wrap{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:20px;margin-bottom:28px;overflow:hidden;position:relative;
}
.map-wrap svg{width:100%;height:auto;display:block}
.map-legend{
  display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;
}
.map-legend span{display:flex;align-items:center;gap:5px}
.map-legend .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.form{display:flex;gap:10px;flex-wrap:wrap}
.input-wrap{
  flex:1;min-width:200px;display:flex;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  transition:border-color .15s;
}
.input-wrap:focus-within{border-color:var(--accent)}
.input-wrap input{
  flex:1;min-width:60px;background:transparent;border:none;outline:none;
  color:var(--text);font-family:var(--mono);font-size:15px;padding:12px 14px;
}
.input-wrap input::placeholder{color:#4d5f76}
select{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--mono);font-size:14px;padding:12px 14px;cursor:pointer;
}
select:focus{outline:none;border-color:var(--accent)}
.btn{
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  color:#04121a;font-weight:700;font-size:14.5px;
  border:none;border-radius:10px;padding:0 24px;cursor:pointer;
  transition:filter .15s;white-space:nowrap;
}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{filter:grayscale(.5) brightness(.75);cursor:wait}

.results{margin-top:28px;display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 16px;
  font-family:var(--mono);font-size:13px;
}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.ok{background:var(--ok)}.dot.err{background:var(--bad)}.dot.wait{background:var(--muted);opacity:.3}
.srv{min-width:72px;font-weight:600;color:var(--fg)}
.ips{color:var(--muted);flex:1;word-break:break-all}
.ms{color:var(--muted);white-space:nowrap}
.summary{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:14px}

.map-dot{transition:fill .3s, r .3s}
.map-dot.wait{fill:#2a3a50;opacity:.5}
.map-dot.ok{fill:var(--ok)}
.map-dot.err{fill:var(--bad)}
.map-dot:hover{r:4.5;fill:#fff}

footer{margin-top:60px;padding:24px 0;text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>

<nav>
  <div class="container nav-inner">
    <a class="logo" href="/"><img src="assets/logo.svg" alt="" width="24" height="24" style="display:block">oxyd<span style="color:var(--muted)">·space</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="https://github.com/YoannDev90/oxyd.space">GitHub</a>
    </div>
  </div>
</nav>

        <!-- server dots -->
        <g id="dots">

          <circle class="map-dot wait" data-ip="1.1.1.1" cx="742" cy="305" r="3"/>
          <circle class="map-dot wait" data-ip="9.9.9.9" cx="155" cy="78" r="3"/>

        </g>
        <!-- region labels -->
        <g fill="var(--muted)" font-family="var(--mono)" font-size="9" opacity=".5">

    <div class="form">

<footer>
  <div class="container">
    Powered by <a href="https://dnsrobot.net">dnsrobot.net</a> API (32 servers) ·
    <a href="/">oxyd.space</a>
  </div>
</footer>

<script>
const S=[
  {ip:"8.8.8.8",l:"Google",r:"US"},
  {ip:"1.1.1.1",l:"Cloudflare",r:"AU"},
  {ip:"9.9.9.9",l:"Quad9",r:"US"},
  {ip:"208.67.222.222",l:"OpenDNS",r:"US"},
  {ip:"77.88.8.8",l:"Yandex",r:"RU"},
  {ip:"64.6.64.6",l:"DNSWatch",r:"DE"},
  {ip:"156.154.70.1",l:"Neustar",r:"US"},
  {ip:"198.41.0.4",l:"IBM Quad9",r:"NL"},
  {ip:"185.228.168.9",l:"CleanBrowsing",r:"US"},
  {ip:"76.76.19.19",l:"Alternate DNS",r:"US"},
  {ip:"109.228.4.246",l:"DNSLink",r:"DE"},
  {ip:"195.46.39.39",l:"Infoblox",r:"NL"},
  {ip:"212.230.255.1",l:"Telia",r:"NL"},
  {ip:"5.11.11.5",l:"DNS for Family",r:"NL"},
  {ip:"94.140.14.14",l:"AdGuard",r:"CZ"},
  {ip:"85.194.70.174",l:"Freenom",r:"NL"},
  {ip:"164.124.101.2",l:"PCH",r:"US"},
  {ip:"209.51.161.14",l:"HE DNS",r:"US"},
  {ip:"114.114.115.115",l:"114DNS",r:"CN"},
  {ip:"1.10.10.10",l:"SafeDNS",r:"DE"},
  {ip:"203.119.13.77",l:"Athena",r:"SG"},
  {ip:"60.32.149.50",l:"IIJ",r:"JP"},
  {ip:"195.186.1.111",l:"vDNS",r:"DE"},
  {ip:"195.243.214.4",l:"DNS.Content",r:"RU"},
  {ip:"139.130.4.4",l:"SaskTel",r:"CA"},
  {ip:"31.7.37.37",l:"TTNet",r:"NL"},
  {ip:"87.213.100.113",l:"OVH DNS",r:"FR"},
  {ip:"203.78.194.179",l:"SK Broadband",r:"KR"},
  {ip:"203.188.242.211",l:"KDDI",r:"JP"},
  {ip:"91.121.62.94",l:"Online.net",r:"FR"},
  {ip:"148.235.82.66",l:"Rackspace",r:"US"},
  {ip:"216.21.129.22",l:"Dyn",r:"US"}
];

const domain=document.getElementById('domain');
const rtype=document.getElementById('rtype');
const go=document.getElementById('go');
const out=document.getElementById('out');
const dots=document.querySelectorAll('.map-dot');

async function check(){
  const d=domain.value.trim().toLowerCase().replace(/^https?:\/\//,'').split('/')[0];
  if(!d)return;
  go.disabled=true;
  out.innerHTML='<span class="summary">Querying 32 servers…</span>';
  dots.forEach(dot=>{dot.className='map-dot wait';});
  const t0=performance.now();
  const results=await Promise.allSettled(S.map(s=>
    fetch('https://dnsrobot.net/api/dns-query',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({domain:d,recordType:rtype.value,dnsServer:s.ip,timeout:5000})
    }).then(r=>r.json()).then(j=>({...j,ip:s.ip,label:s.l,region:s.r})).catch(()=>({status:'error',ip:s.ip,label:s.l,region:s.r}))
  ));
  const elapsed=Math.round(performance.now()-t0);
  let ok=0;
  const html=results.map((r,i)=>{
    const j=r.status==='fulfilled'?r.value:{status:'error',ip:S[i].ip,label:S[i].label,region:S[i].region};
    const s=j.status==='success';
    if(s)ok++;
    dots[i].className='map-dot '+(s?'ok':'err');
    const ips=Array.isArray(j.resolvedIPs)?j.resolvedIPs.join(', '):(j.resolvedData||'');
    return '<div class="row"><span class="dot '+(s?'ok':'err')+'"></span><span class="srv">'+j.ip+'</span><span class="ips">'+(s?ips:'&mdash;')+'</span><span class="ms">'+(s?j.responseTime+'ms':'timeout')+'</span></div>';
  }).join('');
  out.innerHTML=html+'<span class="summary">'+ok+'/'+S.length+' servers resolved · '+elapsed+'ms total</span>';
  go.disabled=false;
}

go.addEventListener('click',check);
domain.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
</script>
</body>
</html>

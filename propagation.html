<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNS Propagation Checker — oxyd.space</title>
<meta name="description" content="Check DNS propagation across 32 global servers. Free, no auth, instant results.">
<link rel="canonical" href="https://oxyd.space/propagation.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23818cf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='url(%23g)' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#05080c;--panel:#0b1118;--panel-2:#0e1520;--line:#182231;
  --text:#dbe7f3;--muted:#8296ad;--accent:#22d3ee;--accent-2:#818cf8;
  --ok:#34d399;--bad:#f87171;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:
    radial-gradient(1000px 500px at 80% -10%,rgba(129,140,248,.12),transparent 60%),
    radial-gradient(800px 420px at 10% -5%,rgba(34,211,238,.10),transparent 55%),
    var(--bg);
  color:var(--text);font-family:"Inter",system-ui,-apple-system,sans-serif;line-height:1.6;min-height:100vh;
}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.container{max-width:960px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(5,8,12,.72);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--text);display:flex;align-items:center;gap:8px}
.logo:hover{text-decoration:none}
.nav-links{display:flex;gap:20px;font-size:14px}
.nav-links a{color:var(--muted)}.nav-links a:hover{color:var(--text)}

.tool{margin:40px auto;max-width:860px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.sub{color:var(--muted);font-size:14.5px;margin-bottom:28px}

.map-wrap{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:28px;overflow:hidden;
}
#map{width:100%;display:block}
#map .land{fill:#0c1520;stroke:#182231;stroke-width:.5}
#map .border{fill:none;stroke:#1e2d40;stroke-width:.3}
#map .graticule{fill:none;stroke:#0f1a28;stroke-width:.4}
#map .sphere{fill:none;stroke:#182231;stroke-width:.6}
.srv-dot{transition:fill .4s, r .3s;cursor:pointer}
.srv-dot:hover{r:5;fill:#fff!important}
.map-legend{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.map-legend span{display:flex;align-items:center;gap:5px}
.map-legend .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.form{display:flex;gap:10px;flex-wrap:wrap}
.input-wrap{
  flex:1;min-width:200px;display:flex;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  transition:border-color .15s;
}
.input-wrap:focus-within{border-color:var(--accent)}
.input-wrap input{
  flex:1;min-width:60px;background:transparent;border:none;outline:none;
  color:var(--text);font-family:var(--mono);font-size:15px;padding:12px 14px;
}
.input-wrap input::placeholder{color:#4d5f76}
select{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--mono);font-size:14px;padding:12px 14px;cursor:pointer;
}
select:focus{outline:none;border-color:var(--accent)}
.btn{
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  color:#04121a;font-weight:700;font-size:14.5px;
  border:none;border-radius:10px;padding:0 24px;cursor:pointer;
  transition:filter .15s;white-space:nowrap;
}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{filter:grayscale(.5) brightness(.75);cursor:wait}

.results{margin-top:28px;display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 16px;
  font-family:var(--mono);font-size:13px;
}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.ok{background:var(--ok)}.dot.err{background:var(--bad)}.dot.wait{background:var(--muted);opacity:.3}
.srv{min-width:72px;font-weight:600}
.ips{color:var(--muted);flex:1;word-break:break-all}
.ms{color:var(--muted);white-space:nowrap}
.summary{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:14px}

footer{margin-top:60px;padding:24px 0;text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>

<nav>
  <div class="container nav-inner">
    <a class="logo" href="/"><img src="assets/logo.svg" alt="" width="24" height="24" style="display:block">oxyd<span style="color:var(--muted)">·space</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="https://github.com/YoannDev90/oxyd.space">GitHub</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="tool">
    <h1>DNS Propagation Checker</h1>
    <p class="sub">Query 32 global DNS servers simultaneously. Free, no auth, instant results.</p>

    <div class="map-wrap">
      <svg id="map" viewBox="0 0 960 500"></svg>
      <div class="map-legend">
        <span><span class="dot wait"></span> Pending</span>
        <span><span class="dot ok"></span> Resolved</span>
        <span><span class="dot err"></span> Failed</span>
      </div>
    </div>

    <div class="form">
      <div class="input-wrap">
        <input id="domain" type="text" autocomplete="off" spellcheck="false" maxlength="253" placeholder="example.com" autofocus>
      </div>
      <select id="rtype">
        <option value="A">A</option><option value="AAAA">AAAA</option><option value="CNAME">CNAME</option>
        <option value="MX">MX</option><option value="NS">NS</option><option value="TXT">TXT</option>
      </select>
      <button class="btn" id="go">Check</button>
    </div>

    <div class="results" id="out"></div>
  </div>
</div>

<footer>
  <div class="container">
    Powered by <a href="https://dnsrobot.net">dnsrobot.net</a> API (32 servers) ·
    <a href="/">oxyd.space</a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const S=[
  {ip:"8.8.8.8",label:"Google",r:"US",lat:37.386,lng:-122.084},
  {ip:"1.1.1.1",label:"Cloudflare",r:"AU",lat:-33.869,lng:151.209},
  {ip:"9.9.9.9",label:"Quad9",r:"US",lat:41.262,lng:-73.205},
  {ip:"208.67.222.222",label:"OpenDNS",r:"US",lat:37.775,lng:-122.419},
  {ip:"77.88.8.8",label:"Yandex",r:"RU",lat:55.756,lng:37.617},
  {ip:"64.6.64.6",label:"DNSWatch",r:"DE",lat:50.11,lng:8.682},
  {ip:"156.154.70.1",label:"Neustar",r:"US",lat:38.907,lng:-77.037},
  {ip:"198.41.0.4",label:"Quad9 EU",r:"NL",lat:52.37,lng:4.895},
  {ip:"185.228.168.9",label:"CleanBrowsing",r:"US",lat:35.227,lng:-80.843},
  {ip:"76.76.19.19",label:"Alternate DNS",r:"US",lat:40.713,lng:-74.006},
  {ip:"109.228.4.246",label:"DNSLink",r:"DE",lat:48.137,lng:11.575},
  {ip:"195.46.39.39",label:"Infoblox",r:"NL",lat:52.37,lng:4.895},
  {ip:"212.230.255.1",label:"Telia",r:"NL",lat:52.09,lng:5.121},
  {ip:"5.11.11.5",label:"DNS for Family",r:"NL",lat:52.09,lng:5.121},
  {ip:"94.140.14.14",label:"AdGuard",r:"CZ",lat:50.088,lng:14.421},
  {ip:"85.194.70.174",label:"Freenom",r:"NL",lat:52.37,lng:4.895},
  {ip:"164.124.101.2",label:"PCH",r:"US",lat:37.775,lng:-122.419},
  {ip:"209.51.161.14",label:"HE DNS",r:"US",lat:29.76,lng:-95.37},
  {ip:"114.114.115.115",label:"114DNS",r:"CN",lat:31.23,lng:121.474},
  {ip:"1.10.10.10",label:"SafeDNS",r:"DE",lat:50.11,lng:8.682},
  {ip:"203.119.13.77",label:"Athena",r:"SG",lat:1.352,lng:103.82},
  {ip:"60.32.149.50",label:"IIJ",r:"JP",lat:35.676,lng:139.65},
  {ip:"195.186.1.111",label:"vDNS",r:"DE",lat:50.11,lng:8.682},
  {ip:"195.243.214.4",label:"DNS.Content",r:"RU",lat:55.756,lng:37.617},
  {ip:"139.130.4.4",label:"SaskTel",r:"CA",lat:52.133,lng:-106.67},
  {ip:"31.7.37.37",label:"TTNet",r:"NL",lat:52.37,lng:4.895},
  {ip:"87.213.100.113",label:"OVH DNS",r:"FR",lat:48.857,lng:2.352},
  {ip:"203.78.194.179",label:"SK Broadband",r:"KR",lat:37.566,lng:126.978},
  {ip:"203.188.242.211",label:"KDDI",r:"JP",lat:35.676,lng:139.65},
  {ip:"91.121.62.94",label:"Online.net",r:"FR",lat:48.857,lng:2.352},
  {ip:"148.235.82.66",label:"Rackspace",r:"US",lat:29.424,lng:-98.493},
  {ip:"216.21.129.22",label:"Dyn",r:"US",lat:43.208,lng:-71.54}
];

const svg=d3.select("#map");
const W=960,H=500;
const proj=d3.geoNaturalEarth1().scale(153).translate([W/2,H/2]);
const path=d3.geoPath(proj);

// defs
const defs=svg.append("defs");
const glow=defs.append("radialGradient").attr("id","glow");
glow.append("stop").attr("offset","0%").attr("stop-color","#22d3ee").attr("stop-opacity",.35);
glow.append("stop").attr("offset","100%").attr("stop-color","#22d3ee").attr("stop-opacity",0);

// sphere outline
svg.append("path").datum({type:"Sphere"}).attr("class","sphere").attr("d",path);

// graticule
const grat=d3.geoGraticule().step([30,30])();
svg.append("path").datum(grat).attr("class","graticule").attr("d",path);

// load world + draw
d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world=>{
  const countries=topojson.feature(world,world.objects.countries);
  svg.append("g")
    .selectAll("path")
    .data(countries.features)
    .join("path")
    .attr("class","land")
    .attr("d",path);

  svg.append("path")
    .datum(topojson.mesh(world,world.objects.countries,(a,b)=>a!==b))
    .attr("class","border")
    .attr("d",path);
});

// server dots group
const dotsG=svg.append("g");
const dots=dotsG.selectAll("circle")
  .data(S)
  .join("circle")
  .attr("class","srv-dot")
  .attr("cx",d=>proj([d.lng,d.lat])[0])
  .attr("cy",d=>proj([d.lng,d.lat])[1])
  .attr("r",3.2)
  .attr("fill","#2a3a50")
  .attr("opacity",.5)
  .append("title")
  .text(d=>d.label+" ("+d.ip+")");

// re-select circles (title is child)
const srvDots=dotsG.selectAll("circle");

// lookup by ip
const dotMap={};
S.forEach((s,i)=>dotMap[s.ip]=i);

function setDot(ip,ok){
  const i=dotMap[ip];
  if(i===undefined)return;
  d3.select(srvDots.nodes()[i])
    .attr("fill",ok?"#34d399":"#f87171")
    .attr("opacity",1);
}

// check logic
const domain=document.getElementById('domain');
const rtype=document.getElementById('rtype');
const go=document.getElementById('go');
const out=document.getElementById('out');

async function check(){
  const d=domain.value.trim().toLowerCase().replace(/^https?:\/\//,'').split('/')[0];
  if(!d)return;
  go.disabled=true;
  out.innerHTML='<span class="summary">Querying 32 servers…</span>';
  srvDots.attr("fill","#2a3a50").attr("opacity",.5);
  const t0=performance.now();
  const results=await Promise.allSettled(S.map(s=>
    fetch('https://dnsrobot.net/api/dns-query',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({domain:d,recordType:rtype.value,dnsServer:s.ip,timeout:5000})
    }).then(r=>r.json()).then(j=>({...j,ip:s.ip,label:s.label,region:s.r})).catch(()=>({status:'error',ip:s.ip,label:s.label,region:s.r}))
  ));
  const elapsed=Math.round(performance.now()-t0);
  let ok=0;
  const html=results.map((r,i)=>{
    const j=r.status==='fulfilled'?r.value:{status:'error',ip:S[i].ip,label:S[i].label,region:S[i].r};
    const s=j.status==='success';
    if(s)ok++;
    setDot(j.ip,s);
    const ips=Array.isArray(j.resolvedIPs)?j.resolvedIPs.join(', '):(j.resolvedData||'');
    return '<div class="row"><span class="dot '+(s?'ok':'err')+'"></span><span class="srv">'+j.ip+'</span><span class="ips">'+(s?ips:'&mdash;')+'</span><span class="ms">'+(s?j.responseTime+'ms':'timeout')+'</span></div>';
  }).join('');
  out.innerHTML=html+'<span class="summary">'+ok+'/'+S.length+' servers resolved · '+elapsed+'ms total</span>';
  go.disabled=false;
}

go.addEventListener('click',check);
domain.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
</script>
</body>
</html>

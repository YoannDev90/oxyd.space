<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNS Propagation Checker — oxyd.space</title>
<meta name="description" content="Check DNS propagation across 32 global servers. Free, no auth, instant results.">
<link rel="canonical" href="https://oxyd.space/propagation.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23818cf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='url(%23g)' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#05080c;--panel:#0b1118;--panel-2:#0e1520;--line:#182231;
  --text:#dbe7f3;--muted:#8296ad;--accent:#22d3ee;--accent-2:#818cf8;
  --ok:#34d399;--bad:#f87171;--warn:#fbbf24;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:
    radial-gradient(1000px 500px at 80% -10%,rgba(129,140,248,.12),transparent 60%),
    radial-gradient(800px 420px at 10% -5%,rgba(34,211,238,.10),transparent 55%),
    var(--bg);
  color:var(--text);font-family:"Inter",system-ui,-apple-system,sans-serif;line-height:1.6;min-height:100vh;
}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.container{max-width:960px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(5,8,12,.72);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--text);display:flex;align-items:center;gap:8px}
.logo:hover{text-decoration:none}
.nav-links{display:flex;gap:20px;font-size:14px}
.nav-links a{color:var(--muted)}.nav-links a:hover{color:var(--text)}

.tool{margin:40px auto;max-width:860px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.sub{color:var(--muted);font-size:14.5px;margin-bottom:28px}

.map-wrap{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:12px;margin-bottom:28px;overflow:hidden;position:relative;
}
.map-hint{
  position:absolute;top:18px;right:20px;z-index:5;
  font-size:11px;color:var(--muted);opacity:.6;pointer-events:none;
  font-family:var(--mono);background:rgba(5,8,12,.7);padding:4px 8px;border-radius:6px;
}
#map{width:100%;display:block;cursor:grab}
#map:active{cursor:grabbing}
#map .land{fill:#0c1520;stroke:#1e2d40;stroke-width:.4}
#map .border{fill:none;stroke:#1a2838;stroke-width:.25}
#map .graticule{fill:none;stroke:#0d1622;stroke-width:.35}
#map .sphere{fill:none;stroke:#182231;stroke-width:.6}
.srv-dot{cursor:pointer;transition:r .2s}
.srv-dot:hover{r:6!important}
.dot-label{
  font-family:var(--mono);font-size:9px;fill:var(--muted);
  pointer-events:none;opacity:0;transition:opacity .2s;
}
.srv-dot:hover+.dot-label{opacity:1}

.map-legend{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.map-legend span{display:flex;align-items:center;gap:5px}
.map-legend .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.form{display:flex;gap:10px;flex-wrap:wrap}
.input-wrap{
  flex:1;min-width:200px;display:flex;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  transition:border-color .15s;
}
.input-wrap:focus-within{border-color:var(--accent)}
.input-wrap input{
  flex:1;min-width:60px;background:transparent;border:none;outline:none;
  color:var(--text);font-family:var(--mono);font-size:15px;padding:12px 14px;
}
.input-wrap input::placeholder{color:#4d5f76}
select{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--mono);font-size:14px;padding:12px 14px;cursor:pointer;
}
select:focus{outline:none;border-color:var(--accent)}
.btn{
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  color:#04121a;font-weight:700;font-size:14.5px;
  border:none;border-radius:10px;padding:0 24px;cursor:pointer;
  transition:filter .15s;white-space:nowrap;
}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{filter:grayscale(.5) brightness(.75);cursor:wait}

.results-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:32px;margin-bottom:16px;
}
.results-header h2{font-size:16px;font-weight:700;color:var(--muted)}
.results-grid{display:flex;flex-direction:column;gap:6px}
.srv-card{
  display:grid;grid-template-columns:8px 1fr auto;gap:14px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 16px;font-family:var(--mono);font-size:13px;
  transition:border-color .2s,background .2s;
}
.srv-card:hover{border-color:#243448;background:var(--panel-2)}
.srv-card .dot{width:8px;height:8px;border-radius:50%}
.srv-card .dot.ok{background:var(--ok)}
.srv-card .dot.err{background:var(--bad)}
.srv-card .dot.wait{background:var(--muted);opacity:.35}
.srv-card .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.srv-card .name{font-weight:600;color:var(--text);font-size:13px}
.srv-card .region{font-size:11px;color:var(--muted)}
.srv-card .result{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0}
.srv-card .ips{color:var(--muted);font-size:12px;word-break:break-all;text-align:right;max-width:280px}
.srv-card .ms{font-size:12px;color:var(--muted);white-space:nowrap}
.srv-card .ms.fast{color:var(--ok)}
.srv-card .ms.slow{color:var(--warn)}
.srv-card.ok{border-left:2px solid var(--ok)}
.srv-card.err{border-left:2px solid var(--bad)}

.summary-bar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 16px;margin-top:16px;font-family:var(--mono);font-size:13px;
}
.summary-bar .count{color:var(--text);font-weight:600}
.summary-bar .count .ok{color:var(--ok)}
.summary-bar .count .err{color:var(--bad)}
.summary-bar .elapsed{color:var(--muted)}
.progress-bar{
  flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;
}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),var(--accent));border-radius:2px;transition:width .3s}

footer{margin-top:60px;padding:24px 0;text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>

<nav>
  <div class="container nav-inner">
    <a class="logo" href="/"><img src="assets/logo.svg" alt="" width="24" height="24" style="display:block">oxyd<span style="color:var(--muted)">·space</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="https://github.com/YoannDev90/oxyd.space">GitHub</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="tool">
    <h1>DNS Propagation Checker</h1>
    <p class="sub">Query 32 global DNS servers simultaneously. Free, no auth, instant results.</p>

    <div class="map-wrap">
      <div class="map-hint">scroll to zoom · drag to pan</div>
      <svg id="map" viewBox="0 0 960 500"></svg>
      <div class="map-legend">
        <span><span class="dot wait"></span> Pending</span>
        <span><span class="dot ok"></span> Resolved</span>
        <span><span class="dot err"></span> Failed</span>
      </div>
    </div>

    <div class="form">
      <div class="input-wrap">
        <input id="domain" type="text" autocomplete="off" spellcheck="false" maxlength="253" placeholder="example.com" autofocus>
      </div>
      <select id="rtype">
        <option value="A">A</option><option value="AAAA">AAAA</option><option value="CNAME">CNAME</option>
        <option value="MX">MX</option><option value="NS">NS</option><option value="TXT">TXT</option>
      </select>
      <button class="btn" id="go">Check</button>
    </div>

    <div id="resultsArea"></div>
  </div>
</div>

<footer>
  <div class="container">
    Powered by <a href="https://dnsrobot.net">dnsrobot.net</a> API (32 servers) ·
    <a href="/">oxyd.space</a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const FLAG={US:"🇺🇸",AU:"🇦🇺",DE:"🇩🇪",RU:"🇷🇺",NL:"🇳🇱",CZ:"🇨🇿",CN:"🇨🇳",SG:"🇸🇬",JP:"🇯🇵",CA:"🇨🇦",FR:"🇫🇷",KR:"🇰🇷"};

const svg=d3.select("#map");
const W=960,H=500;
const proj=d3.geoNaturalEarth1().scale(153).translate([W/2,H/2]);
const path=d3.geoPath(proj);

const defs=svg.append("defs");
const glow=defs.append("filter").attr("id","glow").attr("x","-50%").attr("y","-50%").attr("width","200%").attr("height","200%");
glow.append("feGaussianBlur").attr("stdDeviation","2.5").attr("result","blur");
glow.append("feMerge").selectAll("feMergeNode").data(["blur","SourceGraphic"]).join("feMergeNode").attr("in",d=>d);

const gMain=svg.append("g");

const zoom=d3.zoom()
  .scaleExtent([1,12])
  .on("zoom",e=>{
    gMain.attr("transform",e.transform);
    gMain.selectAll(".srv-dot").attr("r",3.2/e.transform.k);
    gMain.selectAll(".dot-label").attr("font-size",9/e.transform.k);
  });
svg.call(zoom);

// sphere + graticule first
gMain.append("path").datum({type:"Sphere"}).attr("class","sphere").attr("d",path);
gMain.append("path").datum(d3.geoGraticule().step([30,30])()).attr("class","graticule").attr("d",path);

let S=[];
let dotCircles;

function setDot(ip,status){
  const i=S.findIndex(s=>s.ip===ip);
  if(i<0)return;
  const c=d3.select(dotCircles.nodes()[i]);
  if(status==="success") c.attr("fill","#34d399").attr("opacity",1);
  else if(status==="pending") c.attr("fill","#2a3a50").attr("opacity",.5);
  else c.attr("fill","#f87171").attr("opacity",1);
}
function resetDots(){ dotCircles.attr("fill","#2a3a50").attr("opacity",.5); }

function drawDots(data){
  S=data;
  const dotsG=gMain.append("g");
  const dotData=dotsG.selectAll("g").data(S).join("g").attr("transform",d=>{
    const p=proj([d.lng,d.lat]);
    return "translate("+p[0]+","+p[1]+")";
  });
  dotData.append("circle")
    .attr("class","srv-dot").attr("r",3.2)
    .attr("fill","#2a3a50").attr("opacity",.5).attr("filter","url(#glow)");
  dotData.append("text")
    .attr("class","dot-label").attr("x",0).attr("y",-8).attr("text-anchor","middle")
    .text(d=>d.label);
  dotCircles=dotsG.selectAll(".srv-dot");
}

const domain=document.getElementById('domain');
const rtype=document.getElementById('rtype');
const go=document.getElementById('go');
const out=document.getElementById('resultsArea');

function buildGrid(items){
  return '<div class="results-header"><h2>Results</h2></div><div class="results-grid">'
    +items.map(j=>{
      const flag=FLAG[j.country]||'';
      return '<div class="srv-card"><span class="dot wait"></span>'
        +'<div class="info"><span class="name">'+flag+' '+j.label+'</span><span class="region">'+j.city+', '+j.country+' · '+j.ip+'</span></div>'
        +'<div class="result"><span class="ips">—</span><span class="ms"></span></div></div>';
    }).join('')+'</div>';
}

async function check(){
  const d=domain.value.trim().toLowerCase().replace(/^https?:\/\//,'').split('/')[0];
  if(!d)return;
  go.disabled=true;
  resetDots();
  out.innerHTML=buildGrid(S);
  const t0=performance.now();
  const results=await Promise.allSettled(S.map(s=>
    fetch('https://dnsrobot.net/api/dns-query',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({domain:d,recordType:rtype.value,dnsServer:s.ip,timeout:5000})
    }).then(r=>r.json()).then(j=>({...j,ip:s.ip,label:s.label,country:s.country,city:s.city}))
      .catch(()=>({status:'error',ip:s.ip,label:s.label,country:s.country,city:s.city}))
  ));
  const elapsed=Math.round(performance.now()-t0);
  let ok=0;
  const cards=results.map((r,i)=>{
    const j=r.status==='fulfilled'?r.value:{status:'error',ip:S[i].ip,label:S[i].label,country:S[i].country,city:S[i].city};
    const s=j.status==='success';
    if(s)ok++;
    setDot(j.ip,s?"success":"error");
    const ips=Array.isArray(j.resolvedIPs)?j.resolvedIPs.join(', '):(j.resolvedData||'—');
    const ms=j.responseTime||null;
    const cls=ms?(ms<100?'fast':ms>500?'slow':''):'';
    const flag=FLAG[j.country]||'';
    return '<div class="srv-card '+(s?'ok':'err')+'"><span class="dot '+(s?'ok':'err')+'"></span>'
      +'<div class="info"><span class="name">'+flag+' '+j.label+'</span><span class="region">'+j.city+', '+j.country+' · '+j.ip+'</span></div>'
      +'<div class="result"><span class="ips">'+ips+'</span>'+(ms?'<span class="ms '+cls+'">'+ms+'ms</span>':'<span class="ms">timeout</span>')+'</div></div>';
  }).join('');
  const pct=Math.round(ok/S.length*100);
  out.innerHTML=
    '<div class="results-header"><h2>Results</h2><span style="font-family:var(--mono);font-size:13px;color:var(--muted)">'+ok+'/'+S.length+'</span></div>'
    +'<div class="results-grid">'+cards+'</div>'
    +'<div class="summary-bar"><span class="count"><span class="ok">'+ok+'</span> ok · <span class="err">'+(S.length-ok)+'</span> failed</span>'
    +'<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>'
    +'<span class="elapsed">'+elapsed+'ms</span></div>';
  go.disabled=false;
}

go.addEventListener('click',check);
domain.addEventListener('keydown',e=>{if(e.key==='Enter')check()});

// load both sources, then draw
Promise.all([
  fetch('assets/dns.json').then(r=>r.json()),
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
]).then(([servers,world])=>{
  gMain.append("g")
    .selectAll("path").data(topojson.feature(world,world.objects.countries).features).join("path")
    .attr("class","land").attr("d",path);
  gMain.append("path")
    .datum(topojson.mesh(world,world.objects.countries,(a,b)=>a!==b))
    .attr("class","border").attr("d",path);
  drawDots(servers);
});
</script>
</body>
</html>

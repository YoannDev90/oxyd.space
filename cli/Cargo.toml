[package]
name = "oxyd"
version = "0.1.0"
edition = "2021"
description = "CLI tool for oxyd.space subdomain management"
license = "MIT"

[[bin]]
name = "oxyd"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
base64 = "0.22"
arboard = "3"

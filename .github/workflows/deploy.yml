name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build Astro
        run: npm run build
        working-directory: website

      - name: Deploy to live branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clone live branch into a temp directory
          mkdir -p /tmp/live
          cd /tmp/live
          git init
          git remote add origin https://x-access-token:${{ github.token }}@github.com/YoannDev90/oxyd.space.git
          git fetch origin live --depth=1
          git checkout live

          # Clean everything
          git rm -rf .

          # Copy new build (including hidden files like .nojekyll)
          cp -a $GITHUB_WORKSPACE/dist/. .

          # Add and commit
          git add -A
          git commit -m "deploy: update site from main" || echo "No changes to commit"
          git push --force origin HEAD:live

name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean workspace
        run: find . -maxdepth 1 ! -name '.git' ! -name 'website' ! -name 'docs' ! -name '.' -exec rm -rf {} +

      - name: Copy website to root
        run: |
          cp -r website/* .
          rm -rf website

      - name: Deploy to live branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git reset HEAD
          git add -- assets/ docs/ CNAME index.html 404.html robots.txt sitemap.xml checker.html propagation.html tools.html changelog.html
          git commit -m "deploy: update site from main" || echo "No changes to commit"
          git push --force origin HEAD:live

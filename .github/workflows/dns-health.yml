name: DNS health check

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dns-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Probe global DNS servers
        run: python scripts/healthcheck_dns.py

      - name: Commit server health changes
        run: |
          git diff --quiet website/public/assets/dns.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/public/assets/dns.json
          git commit -m "dns: refresh server health flags"
          git push origin main

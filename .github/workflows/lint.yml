name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint Python files
        run: |
          ruff check scripts/ tests/
          ruff format --check scripts/ tests/

      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          find . -name "*.json" -not -path "./.git/*" -not -path "./node_modules/*" | while read f; do
            echo "Checking $f..."
            python -m json.tool "$f" > /dev/null || exit 1
          done
          echo "All JSON files are valid ✅"

      - name: Validate YAML files
        run: |
          echo "Validating YAML files..."
          pip install pyyaml
          python -c "
          import yaml
          import sys
          from pathlib import Path

          errors = []
          for f in Path('.').rglob('*.yml'):
              if '.git' in str(f) or 'node_modules' in str(f):
                  continue
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')

          for f in Path('.').rglob('*.yaml'):
              if '.git' in str(f) or 'node_modules' in str(f):
                  continue
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')

          if errors:
              for e in errors:
                  print(f'❌ {e}')
              sys.exit(1)
          else:
              print('All YAML files are valid ✅')
          "

      - name: Validate domain configs
        run: |
          echo "Validating domain configurations..."
          python scripts/validate.py
          echo "All domain configs are valid ✅"

      - name: Run integration tests
        run: |
          python tests/test_integration.py

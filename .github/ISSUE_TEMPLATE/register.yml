name: Subdomain registration
description: Register, update or delete your free oxyd.space subdomain
title: "Subdomain registration"
labels: ["registration"]
body:
  - type: dropdown
    id: request-type
    attributes:
      label: What do you want to do?
      description: Choose an action
      options:
        - Register a new subdomain
        - Update my records
        - Delete my subdomain
    validations:
      required: true

  - type: dropdown
    id: base-domain
    attributes:
      label: Base domain
      description: "Your subdomain will be [name].<chosen domain>. Most users pick oxyd.space."
      options:
        - oxyd.space
    validations:
      required: true

  - type: input
    id: subdomain
    attributes:
      label: Subdomain name
      description: |
        Choose the name for your subdomain (the part before .oxyd.space).
        Examples: `blog`, `api`, `nextcloud`, `s1.api`
        - Lowercase letters, numbers and hyphens only
        - Up to 4 levels: `name`, `service.name`, `s1.service.name`
      placeholder: blog
    validations:
      required: true

  - type: dropdown
    id: record-type
    attributes:
      label: Record type
      description: |
        What kind of destination are you pointing to?
        - **CNAME** → Website hosting (GitHub Pages, Vercel, Netlify, Cloudflare Pages…)
        - **A** → Server IP address (IPv4)
        - **AAAA** → Server IP address (IPv6)
        - **TXT** → Verification tokens (Google Search Console, Let's Encrypt…)
      options:
        - CNAME
        - A
        - AAAA
        - TXT
    validations:
      required: true

  - type: input
    id: record-value
    attributes:
      label: Record value
      description: |
        The destination for your subdomain:
        - CNAME → hostname (e.g. `yourname.github.io`)
        - A/AAAA → IP address (e.g. `203.0.113.42`)
        - TXT → text string (e.g. `google-site-verification=abc123`)
      placeholder: yourname.github.io
    validations:
      required: true

  - type: textarea
    id: additional-records
    attributes:
      label: Additional DNS records (optional)
      description: |
        Add extra records if needed, one per line.
        Format: `TYPE VALUE` or `TYPE VALUE ttl=3600`
        Example:
        ```
        A 203.0.113.10
        AAAA 2001:db8::1
        TXT "v=spf1 include:_spf.google.com ~all"
        ```
      placeholder: |
        A 203.0.113.10

  - type: checkboxes
    id: www-prefix
    attributes:
      label: Enable www prefix
      description: If checked, `www.<your subdomain>` will also work with the same records.
      options:
        - label: Yes, also create www.<subdomain>

  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I will not use this subdomain for phishing, malware, spam or illegal content
          required: true
        - label: I understand the service is provided as-is and may be discontinued
          required: true

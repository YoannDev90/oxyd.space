    <circle cx="25" cy="32" r="14"/>
    <circle cx="39" cy="32" r="14"/>
    <path d="M 36.57 45.79 A 14 14 0 0 1 28.28 41.00"/>
  </g>

  <!-- wordmark -->
  <text x="440" y="330" font-family="Fira Sans" font-weight="700" font-size="118"
